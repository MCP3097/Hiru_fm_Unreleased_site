<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hirushan D Live — Radio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    --bg-0: #eef1f6;
    --bg-1: #ffffff;
    --panel-edge: rgba(15, 23, 42, 0.10);
    --text-0: #171b26;
    --text-1: #545e73;
    --text-2: #7b8497;
    --coral: #ef4444;
    --amber: #f59e0b;
    --led-off: #1b2030;
    --glass-bg: rgba(255, 255, 255, 0.62);
    --glass-border: rgba(255, 255, 255, 0.8);
    --glass-inset: rgba(255, 255, 255, 0.9);
    --glow-a: rgba(255, 255, 255, 0.95);
    --glow-b: rgba(20, 22, 30, 0.28);
    --shadow-c: rgba(31, 41, 66, 0.14);
    --toast-bg: rgba(255, 255, 255, 0.9);
    --blob-1: rgba(255, 255, 255, 0.9);
    --blob-2: rgba(203, 224, 255, 0.6);
    --blob-3: rgba(255, 222, 222, 0.45);
    --blob-4: rgba(214, 244, 255, 0.55);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg-0: #0b0e14;
      --bg-1: #12161f;
      --panel-edge: rgba(255, 255, 255, 0.10);
      --text-0: #eef1f7;
      --text-1: #a7b0c4;
      --text-2: #7c8598;
      --coral: #f87171;
      --amber: #fbbf24;
      --led-off: #262c3d;
      --glass-bg: rgba(255, 255, 255, 0.06);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-inset: rgba(255, 255, 255, 0.10);
      --glow-a: rgba(255, 255, 255, 0.32);
      --glow-b: rgba(0, 0, 0, 0.7);
      --shadow-c: rgba(0, 0, 0, 0.5);
      --toast-bg: rgba(18, 20, 30, 0.9);
      --blob-1: rgba(70, 100, 180, 0.32);
      --blob-2: rgba(45, 85, 150, 0.28);
      --blob-3: rgba(110, 55, 55, 0.2);
      --blob-4: rgba(35, 120, 150, 0.24);
    }
  }
  :root[data-theme="dark"] {
    --bg-0: #0b0e14;
    --bg-1: #12161f;
    --panel-edge: rgba(255, 255, 255, 0.10);
    --text-0: #eef1f7;
    --text-1: #a7b0c4;
    --text-2: #7c8598;
    --coral: #f87171;
    --amber: #fbbf24;
    --led-off: #262c3d;
    --glass-bg: rgba(255, 255, 255, 0.06);
    --glass-border: rgba(255, 255, 255, 0.12);
    --glass-inset: rgba(255, 255, 255, 0.10);
    --glow-a: rgba(255, 255, 255, 0.32);
    --glow-b: rgba(0, 0, 0, 0.7);
    --shadow-c: rgba(0, 0, 0, 0.5);
    --toast-bg: rgba(18, 20, 30, 0.9);
    --blob-1: rgba(70, 100, 180, 0.32);
    --blob-2: rgba(45, 85, 150, 0.28);
    --blob-3: rgba(110, 55, 55, 0.2);
    --blob-4: rgba(35, 120, 150, 0.24);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: linear-gradient(180deg, var(--bg-1), var(--bg-0));
    color: var(--text-0);
    padding: 28px 16px;
    position: relative;
    overflow: hidden;
    transition: background 0.3s ease, color 0.3s ease;
  }

  /* Ambient light layer — soft color blend with NO CSS filter (filter
     blur is expensive to repaint every frame). The softness comes
     purely from the gradient's own falloff, and the animation only
     touches transform, so it stays on the compositor and costs
     almost nothing. */
  body::before {
    content: "";
    position: fixed;
    inset: -15%;
    background:
      radial-gradient(45% 45% at 18% 22%, var(--blob-1) 0%, transparent 78%),
      radial-gradient(50% 50% at 82% 18%, var(--blob-2) 0%, transparent 78%),
      radial-gradient(55% 55% at 25% 88%, var(--blob-3) 0%, transparent 78%),
      radial-gradient(50% 50% at 88% 82%, var(--blob-4) 0%, transparent 78%);
    animation: crystalDrift 34s ease-in-out infinite;
    will-change: transform;
    z-index: 0;
    pointer-events: none;
    transition: background 0.3s ease;
  }
  @keyframes crystalDrift {
    0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
    50%      { transform: translate3d(-2%, 1.5%, 0) scale(1.03); }
  }

  .unit {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 380px;
    background: var(--glass-bg);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    border: 1px solid var(--glass-border);
    border-radius: 22px;
    padding: 22px 24px 22px;
    box-shadow: 0 20px 46px var(--shadow-c), inset 0 1px 0 var(--glass-inset),
      0 0 20px 1px var(--glow-a);
    transition: background 0.3s ease, border-color 0.3s ease;
  }

  /* ---------- toolbar ---------- */
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .theme-toggle {
    flex-shrink: 0;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 1px solid var(--panel-edge);
    background: transparent;
    color: var(--text-1);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: color 0.2s ease, transform 0.15s ease, border-color 0.2s ease;
  }
  .theme-toggle:hover { color: var(--coral); border-color: var(--coral); transform: scale(1.06); }
  .theme-toggle:active { transform: scale(0.94); }

  /* ---------- right-click warning toast ---------- */
  .rc-warning {
    position: fixed;
    left: 50%;
    bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    transform: translate(-50%, 12px);
    background: var(--toast-bg);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    color: var(--text-0);
    border: 1px solid var(--panel-edge);
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 0.82rem;
    box-shadow: 0 10px 24px var(--shadow-c);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 999;
  }
  .rc-warning.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  /* ---------- brand ---------- */
  .brand { text-align: left; margin-bottom: 18px; }
  .brand h1 {
    margin: 0;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 1.5rem;
    letter-spacing: 0.2px;
    line-height: 1.1;
    background: linear-gradient(
      100deg,
      #b8860b 0%,
      #ffd700 18%,
      #fff8dc 32%,
      #c0c0c0 45%,
      #fffbe6 55%,
      #ffe066 68%,
      #d4af37 82%,
      #ffd700 100%
    );
    background-size: 250% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 6px rgba(255, 215, 0, 0.55)) drop-shadow(0 0 14px rgba(255, 224, 130, 0.35));
    animation: brandGlow 4s linear infinite;
    will-change: background-position;
  }
  @keyframes brandGlow {
    0%   { background-position: 250% 0; }
    100% { background-position: -50% 0; }
  }
  .brand p {
    margin: 4px 0 0;
    font-size: 0.82rem;
    color: var(--text-2);
  }

  /* ---------- tuner dial ---------- */
  .dial {
    position: relative;
    height: 34px;
    border-radius: 10px;
    background: repeating-linear-gradient(
      90deg,
      var(--led-off) 0 1px,
      transparent 1px 8px
    );
    background-color: rgba(0,0,0,0.25);
    border: 1px solid var(--panel-edge);
    margin-bottom: 20px;
    overflow: hidden;
  }
  .dial::after {
    content: "";
    position: absolute;
    top: 0; bottom: 0;
    left: 42%;
    width: 3px;
    background: var(--coral);
    box-shadow: 0 0 10px var(--coral);
    border-radius: 2px;
  }

  /* ---------- status row ---------- */
  .status-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    font-size: 0.82rem;
  }
  .status-left { display: flex; align-items: center; gap: 8px; color: var(--text-1); }
  .dot {
    position: relative;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--led-off);
    transition: background 0.3s ease;
    flex-shrink: 0;
  }
  .dot.live { background: var(--coral); box-shadow: 0 0 8px var(--coral); }
  .dot.live::after {
    content: "";
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    background: var(--coral);
    opacity: 0.55;
    animation: pulse 1.5s ease-out infinite;
  }
  @keyframes pulse {
    0% { transform: scale(0.4); opacity: 0.7; }
    100% { transform: scale(2.4); opacity: 0; }
  }
  .timer { font-variant-numeric: tabular-nums; color: var(--text-2); }
  .listeners { color: var(--text-2); }

  /* ---------- transport ---------- */
  .transport {
    display: flex;
    align-items: center;
    gap: 18px;
    margin-bottom: 22px;
  }
  .play-btn {
    width: 60px; height: 60px;
    border-radius: 50%;
    border: none;
    flex-shrink: 0;
    background: linear-gradient(135deg, var(--coral), #ff9472);
    color: #fff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 8px 18px rgba(239,68,68,0.35);
    transition: transform 0.15s ease;
  }
  .play-btn svg { margin-left: 2px; }
  .play-btn:hover { transform: scale(1.05); }
  .play-btn:active { transform: scale(0.95); }

  .scanner {
    flex: 1;
    height: 34px;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 0 10px;
    background: #0a0610;
    border: 1px solid var(--panel-edge);
    border-radius: 8px;
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.6);
  }
  .scanner i {
    flex: 1;
    height: 10px;
    border-radius: 2px;
    background: #3a0d0d;
    box-shadow: none;
    transition: background 90ms linear, box-shadow 90ms linear;
  }
  .scanner i.eye {
    background: #ff2222;
    box-shadow: 0 0 10px 2px #ff2222, 0 0 2px #fff;
  }
  .scanner i.trail {
    background: #a01414;
    box-shadow: 0 0 4px 1px rgba(255,34,34,0.5);
  }

  /* ---------- volume ---------- */
  .row { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .row svg { flex-shrink: 0; color: var(--text-2); }
  input[type="range"] {
    flex: 1;
    accent-color: var(--coral);
  }

  /* ---------- notes ---------- */
  .notes { margin-top: 22px; border-top: 1px solid var(--panel-edge); padding-top: 16px; }
  .notes-head { font-size: 0.82rem; color: var(--text-1); margin-bottom: 8px; }
  .notes-sub { font-size: 0.72rem; color: var(--text-2); margin: -4px 0 10px; }
  .notes textarea {
    width: 100%;
    min-height: 54px;
    resize: vertical;
    background: rgba(0,0,0,0.25);
    border: 1px solid var(--panel-edge);
    border-radius: 10px;
    color: var(--text-0);
    font-family: inherit;
    font-size: 0.85rem;
    padding: 10px;
  }
  .notes-actions { display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-top: 8px; }
  .notes-status { font-size: 0.72rem; color: var(--text-2); }
  .notes-actions button {
    background: none;
    border: 1px solid var(--panel-edge);
    color: var(--text-1);
    font-size: 0.78rem;
    padding: 6px 14px;
    border-radius: 8px;
    cursor: pointer;
  }
  .notes-actions button:disabled { opacity: 0.5; cursor: default; }
  .notes-actions button:not(:disabled):hover { border-color: var(--coral); color: var(--text-0); }
  .notes-list { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
  .notes-list div {
    font-size: 0.82rem;
    color: var(--text-1);
    background: rgba(0,0,0,0.2);
    border-radius: 8px;
    padding: 8px 10px;
    white-space: pre-wrap;
  }
  .notes-list time { display: block; font-size: 0.68rem; color: var(--text-2); margin-top: 4px; }
  .notes-hint { font-size: 0.68rem; color: var(--text-2); margin-top: 6px; }
</style>
</head>
<body>

  <div class="rc-warning" id="rcWarning">Right-click is disabled on this site</div>

  <div class="unit">
    <div class="toolbar">
      <div class="brand">
        <h1>Hirushan D Live</h1>
        <p>Live streaming radio</p>
      </div>
      <button class="theme-toggle" id="themeToggle" aria-label="Switch to dark mode">
        <svg id="themeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/>
        </svg>
      </button>
    </div>

    <div class="dial" aria-hidden="true"></div>

    <div class="status-row">
      <div class="status-left">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">Stopped</span>
      </div>
      <span class="timer" id="timer"></span>
      <span class="listeners" id="listeners">~ 0 listening</span>
    </div>

    <audio id="radio" preload="none">
      <source src="https://radio.lotustechnologieslk.net:2020/stream/hirufmgarden/stream/1/" type="audio/mpeg">
    </audio>

    <div class="transport">
      <button id="playBtn" class="play-btn" aria-label="Play">
        <svg id="playIcon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
          <path id="playPath" d="M8 5v14l11-7z"/>
        </svg>
      </button>
      <div class="scanner" id="scanner">
        <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
      </div>
    </div>

    <div class="row">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3z"/></svg>
      <input type="range" id="volume" min="0" max="1" step="0.01" value="1">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.26 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
    </div>

    <div class="notes">
      <div class="notes-head">Notes</div>
      <p class="notes-sub">Posted to the Telegram channel — visible to everyone there.</p>
      <textarea id="noteInput" placeholder="Jot something down about what's playing…" maxlength="240"></textarea>
      <div class="notes-actions">
        <span class="notes-status" id="noteStatus"></span>
        <button id="noteSave">Send note</button>
      </div>
      <div class="notes-list" id="notesList"></div>
      <p class="notes-hint">Sent to the show's Telegram channel.</p>
    </div>
  </div>

  <script>
    const audio = document.getElementById('radio');
    const playBtn = document.getElementById('playBtn');
    const playPath = document.getElementById('playPath');
    const statusText = document.getElementById('statusText');
    const statusDot = document.getElementById('statusDot');
    const scanner = document.getElementById('scanner');
    const scannerLeds = Array.from(scanner.children);
    const volume = document.getElementById('volume');
    const timerEl = document.getElementById('timer');
    const listenersEl = document.getElementById('listeners');

    const ICON_PLAY = "M8 5v14l11-7z";
    const ICON_PAUSE = "M6 5h4v14H6zM14 5h4v14h-4z";

    let isPlaying = false;
    let startedAt = null;
    let timerInterval = null;

    function formatElapsed(ms) {
      const total = Math.floor(ms / 1000);
      const m = String(Math.floor(total / 60)).padStart(2, '0');
      const s = String(total % 60).padStart(2, '0');
      return m + ':' + s;
    }

    playBtn.addEventListener('click', () => {
      if (!isPlaying) {
        statusText.textContent = 'Connecting…';
        audio.load();
        audio.play().catch(() => {
          statusText.textContent = 'Error: could not connect';
          statusDot.classList.remove('live');
        });
      } else {
        audio.pause();
      }
    });

    audio.addEventListener('playing', () => {
      isPlaying = true;
      playPath.setAttribute('d', ICON_PAUSE);
      playBtn.setAttribute('aria-label', 'Pause');
      statusText.textContent = 'Live';
      statusDot.classList.add('live');
      startScanner();
      startedAt = Date.now();
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timerEl.textContent = formatElapsed(Date.now() - startedAt);
      }, 1000);
      timerEl.textContent = '00:00';
    });

    audio.addEventListener('pause', () => {
      isPlaying = false;
      playPath.setAttribute('d', ICON_PLAY);
      playBtn.setAttribute('aria-label', 'Play');
      statusText.textContent = 'Stopped';
      statusDot.classList.remove('live');
      stopScanner();
      clearInterval(timerInterval);
      timerEl.textContent = '';
    });

    audio.addEventListener('waiting', () => { statusText.textContent = 'Buffering…'; });

    audio.addEventListener('error', () => {
      statusText.textContent = 'Error: stream unavailable';
      statusDot.classList.remove('live');
      stopScanner();
      isPlaying = false;
      playPath.setAttribute('d', ICON_PLAY);
      playBtn.setAttribute('aria-label', 'Play');
      clearInterval(timerInterval);
      timerEl.textContent = '';
    });

    volume.addEventListener('input', () => { audio.volume = volume.value; });

    // ---- theme toggle (light / dark, remembers choice on this device) ----
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    const ICON_SUN = 'M12 4V2M12 22v-2M4.93 4.93 3.51 3.51M20.49 20.49l-1.42-1.42M4 12H2m20 0h-2M4.93 19.07l-1.42 1.42M20.49 3.51l-1.42 1.42M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z';
    const ICON_MOON = 'M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z';
    const THEME_KEY = 'hirushan-theme';

    function systemTheme() {
      return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }

    function applyTheme(t) {
      document.documentElement.setAttribute('data-theme', t);
      themeIcon.setAttribute('d', t === 'dark' ? ICON_SUN : ICON_MOON);
      themeToggle.setAttribute('aria-label', t === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
    }

    let storedTheme = null;
    try { storedTheme = localStorage.getItem(THEME_KEY); } catch (e) {}
    applyTheme(storedTheme || systemTheme());

    themeToggle.addEventListener('click', () => {
      const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      applyTheme(next);
      try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
    });

    // ---- block right-click, show a brief warning ----
    const rcWarning = document.getElementById('rcWarning');
    let rcTimeout = null;
    document.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      rcWarning.classList.add('show');
      clearTimeout(rcTimeout);
      rcTimeout = setTimeout(() => rcWarning.classList.remove('show'), 2000);
    });

    // ---- Knight Rider scanner ----
    let scannerInterval = null;
    let scannerPos = 0;
    let scannerDir = 1;

    function paintScanner() {
      scannerLeds.forEach((led, i) => {
        led.classList.remove('eye', 'trail');
        const dist = Math.abs(i - scannerPos);
        if (dist === 0) led.classList.add('eye');
        else if (dist === 1) led.classList.add('trail');
      });
    }

    function startScanner() {
      if (scannerInterval) return;
      scannerPos = 0;
      scannerDir = 1;
      scannerInterval = setInterval(() => {
        paintScanner();
        scannerPos += scannerDir;
        if (scannerPos >= scannerLeds.length - 1 || scannerPos <= 0) scannerDir *= -1;
      }, 90);
    }

    function stopScanner() {
      clearInterval(scannerInterval);
      scannerInterval = null;
      scannerLeds.forEach(led => led.classList.remove('eye', 'trail'));
    }

    // ---- cosmetic listener pulse ----
    let listenerCount = 40 + Math.floor(Math.random() * 60);
    listenersEl.textContent = '~ ' + listenerCount + ' listening';
    setInterval(() => {
      listenerCount = Math.max(10, listenerCount + Math.floor(Math.random() * 7) - 3);
      listenersEl.textContent = '~ ' + listenerCount + ' listening';
    }, 6000);

    // ---- notes: posted to Telegram channel (visible to anyone in it) ----
    const TG_BOT_TOKEN = '8977225459:AAGvVjOCU0OsewbEeXuPjZfXaH5KYjHFvK0';
    const TG_CHAT_ID = '-1004240012971';

    const noteInput = document.getElementById('noteInput');
    const noteSave = document.getElementById('noteSave');
    const noteStatus = document.getElementById('noteStatus');
    const notesList = document.getElementById('notesList');

    // Session-only record of notes sent from this device (not shared —
    // the channel itself is the shared, permanent copy).
    let sentThisSession = [];

    function renderNotes() {
      notesList.innerHTML = '';
      sentThisSession.slice().reverse().forEach(n => {
        const div = document.createElement('div');
        const time = document.createElement('time');
        time.textContent = new Date(n.at).toLocaleString();
        div.textContent = n.text;
        div.appendChild(time);
        notesList.appendChild(div);
      });
    }

    async function sendToTelegram(text) {
      const url = `https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage`;
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_id: TG_CHAT_ID, text: text })
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.description || 'Telegram API error');
      return data;
    }

    noteSave.addEventListener('click', async () => {
      const text = noteInput.value.trim();
      if (!text) return;

      noteSave.disabled = true;
      noteStatus.textContent = 'Sending…';

      try {
        await sendToTelegram(text);
        sentThisSession.push({ text, at: Date.now() });
        noteInput.value = '';
        renderNotes();
        noteStatus.textContent = 'Sent ✓';
      } catch (err) {
        noteStatus.textContent = 'Failed to send';
        console.error('Telegram send error:', err);
      } finally {
        noteSave.disabled = false;
        setTimeout(() => { noteStatus.textContent = ''; }, 2500);
      }
    });

    renderNotes();
  </script>
</body>
</html>
